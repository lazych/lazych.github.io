<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <title>Lazy - Download</title>
  <link href="https://fonts.googleapis.com/css?family=Raleway:900,400" rel="stylesheet" type="text/css">
  <style type="text/css">
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
    }
    body {
      font-family: Raleway, Helvetica Neue, Helvetica, sans-serif;
      font-weight: 400;
      font-size: 14px;
      background-color: #101010;
      color: #eee;
    }
    .divide {
      position: absolute;
      top: 0;
      width: 100%;
      padding: 0;
      margin: 0;
      background: #1e5799;
      background: -moz-linear-gradient(left, #1e5799 0, #f300ff 50%, #e0ff00 100%);
      background: -webkit-gradient(linear, left top, right top, color-stop(0, #1e5799), color-stop(50%, #f300ff), color-stop(100%, #e0ff00));
      background: -webkit-linear-gradient(left, #1e5799 0, #f300ff 50%, #e0ff00 100%);
      background: -o-linear-gradient(left, #1e5799 0, #f300ff 50%, #e0ff00 100%);
      background: -ms-linear-gradient(left, #1e5799 0, #f300ff 50%, #e0ff00 100%);
      background: linear-gradient(to right, #1e5799 0, #f300ff 50%, #e0ff00 100%);
      height: 3px;
      border-bottom: 1px solid #000;
    }
    .outer {
      display: table;
      height: 100%;
      width: 100%;
      position: absolute;
    }
    .middle {
      display: table-cell;
      vertical-align: middle;
    }
    .inner {
      margin-left: auto;
      margin-right: auto;
      width: 500px;
      text-align: center;
    }
    #title h1 {
      margin: 0 auto;
      padding: 0;
      font-size: 62pt;
      font-weight: 400;
      color: #eee;
      text-align: center;
      height: 120px;
    }
    #title span {
      color: #B57EDCFF;
    }
    p {
      font-size: 1.75em;
      color: #ddd;
      margin: 10px 0 0;
      text-align: center;
    }
    .download-section {
      margin-top: 40px;
    }
    .download-btn {
      display: inline-block;
      padding: 20px 60px;
      font-size: 1.5em;
      font-weight: 900;
      font-family: Raleway, Helvetica Neue, Helvetica, sans-serif;
      color: #101010;
      background: linear-gradient(to right, #1e5799, #f300ff, #e0ff00);
      border: none;
      border-radius: 5px;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      margin-top: 20px;
    }
    .download-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(243, 0, 255, 0.5);
    }
    .version-info {
      margin-top: 30px;
      font-size: 1em;
      color: #888;
    }
    .alternative-link {
      margin-top: 50px;
      font-size: 0.9em;
    }
    .alternative-link a {
      color: #B57EDCFF;
      text-decoration: none;
    }
    .alternative-link a:hover {
      text-decoration: underline;
    }
    .trifecta {
      margin: 30px auto 0;
      font-size: 26px;
      width: 80px;
      text-align: center;
    }
    .trifecta > div {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 100%;
      background-color: #eee;
      -webkit-animation: bdelay 1.4s infinite ease-in-out both;
      animation: bdelay 1.4s infinite ease-in-out both;
    }
    .trifecta .one {
      -webkit-animation-delay: -.32s;
      animation-delay: -.32s;
    }
    .trifecta .two {
      -webkit-animation-delay: -.16s;
      animation-delay: -.16s;
    }
    @-webkit-keyframes bdelay {
      0%, 100%, 80% { -webkit-transform: scale(0) }
      40% { -webkit-transform: scale(1) }
    }
    @keyframes bdelay {
      0%, 100%, 80% { -webkit-transform: scale(0); transform: scale(0) }
      40% { transform: scale(1); -webkit-transform: scale(1) }
    }
  </style>
</head>
<body>
  <div class="divide"></div>
  <div class="outer">
    <div class="middle">
      <div class="inner">
        <div id="title">
          <h1>La<span>zy</span></h1>
        </div>
        <p>Download Loader</p>
        <div class="trifecta">
          <div class="one"></div>
          <div class="two"></div>
          <div class="three"></div>
        </div>
        <div class="download-section">
          <a href="https://github.com/lazych/lazych.github.io/raw/refs/heads/files/Loader.zip" class="download-btn" download>DOWNLOAD</a>
        </div>
        <div class="version-info">
          Version 1.0.0 | Windows x64
        </div>
        <div class="alternative-link">
          <a href="forums/">Back to Forums</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
